# =====================================================================
# CyberSentinel · Sites et API d'IA surveillés par le proxy
# =====================================================================
# Le proxy n'analyse QUE les requêtes vers ces domaines (le reste du
# trafic passe sans être lu : voir docs/rgpd.md).
#
#   domaines   un hôte correspond s'il est égal au domaine ou s'il
#              en est un sous-domaine (ex. xxx.chatgpt.com)
#   chemins    début du chemin des requêtes qui portent le prompt.
#              « à confirmer » = à vérifier avec une capture mitmproxy
#              (les sites changent souvent leurs URL internes).
#   format     json | form (formulaire encodé) | websocket
#   priorite   1 = démo / à couvrir d'abord, 2 = ensuite, 3 = plus tard
# =====================================================================

version: 1

sites:

  # --- Interfaces web grand public ------------------------------------
  - id: chatgpt
    nom: ChatGPT (OpenAI)
    domaines: [chatgpt.com, chat.openai.com]
    chemins: ["/backend-api/conversation", "/backend-api/f/conversation"]
    format: json
    champ_prompt: "messages[].content.parts[]"
    priorite: 1
    statut: à confirmer par la capture d'Arno

  - id: gemini
    nom: Gemini (Google)
    domaines: [gemini.google.com]
    chemins: ["/_/BardChatUi/data/"]
    format: form          # paramètre f.req = JSON imbriqué dans un formulaire
    priorite: 1
    statut: à confirmer

  - id: claude
    nom: Claude (Anthropic)
    domaines: [claude.ai]
    chemins: ["/api/organizations/"]   # .../chat_conversations/<id>/completion
    format: json
    champ_prompt: "prompt"
    priorite: 1
    statut: à confirmer

  - id: mistral
    nom: Le Chat (Mistral AI)
    domaines: [chat.mistral.ai]
    chemins: []
    format: json
    priorite: 1
    statut: chemin à trouver

  - id: copilot
    nom: Microsoft Copilot
    domaines: [copilot.microsoft.com, copilot.cloud.microsoft, m365.cloud.microsoft]
    chemins: []
    format: websocket     # le prompt passe probablement par un WebSocket : addon à adapter
    priorite: 1
    statut: chemin à trouver

  - id: deepseek
    nom: DeepSeek
    domaines: [chat.deepseek.com]
    chemins: []
    format: json
    priorite: 2
    statut: chemin à trouver

  - id: perplexity
    nom: Perplexity
    domaines: [perplexity.ai, www.perplexity.ai]
    chemins: []
    format: json
    priorite: 2
    statut: chemin à trouver

  - id: grok
    nom: Grok (xAI)
    domaines: [grok.com]
    chemins: []
    format: json
    priorite: 3
    statut: chemin à trouver

  - id: meta_ai
    nom: Meta AI
    domaines: [meta.ai, www.meta.ai]
    chemins: []
    format: json
    priorite: 3
    statut: chemin à trouver

  - id: poe
    nom: Poe
    domaines: [poe.com]
    chemins: []
    format: json
    priorite: 3
    statut: chemin à trouver

  - id: huggingchat
    nom: HuggingChat
    domaines: [huggingface.co]
    chemins: ["/chat/"]
    format: json
    priorite: 3
    statut: à confirmer

  # --- API utilisées par les développeurs (scripts, extensions IDE) ----
  - id: openai_api
    nom: API OpenAI
    domaines: [api.openai.com]
    chemins: ["/v1/chat/completions", "/v1/responses"]
    format: json
    champ_prompt: "messages[].content | input"
    priorite: 2
    statut: documenté

  - id: anthropic_api
    nom: API Anthropic
    domaines: [api.anthropic.com]
    chemins: ["/v1/messages"]
    format: json
    champ_prompt: "messages[].content"
    priorite: 2
    statut: documenté

  - id: gemini_api
    nom: API Gemini
    domaines: [generativelanguage.googleapis.com]
    chemins: ["/v1beta/models/", "/v1/models/"]
    format: json
    champ_prompt: "contents[].parts[].text"
    priorite: 2
    statut: documenté

  - id: mistral_api
    nom: API Mistral
    domaines: [api.mistral.ai]
    chemins: ["/v1/chat/completions"]
    format: json
    champ_prompt: "messages[].content"
    priorite: 2
    statut: documenté

  - id: github_copilot
    nom: GitHub Copilot (IDE)
    domaines: [api.githubcopilot.com, copilot-proxy.githubusercontent.com]
    chemins: []
    format: json
    priorite: 3
    statut: à confirmer (le code envoyé par l'IDE peut contenir des secrets)
