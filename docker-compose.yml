# Lance la base MySQL et l'API CyberSentinel :  docker compose up
# Les mots de passe se règlent dans un fichier .env (voir .env.example).

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-cybersentinel}
      MYSQL_USER: ${DB_USER:-cybersentinel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cybersentinel}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-a-changer}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-cybersentinel}
      DB_USER: ${DB_USER:-cybersentinel}
      DB_PASSWORD: ${DB_PASSWORD:-cybersentinel}
      FRONT_ORIGIN: ${FRONT_ORIGIN:-http://localhost:5173}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
